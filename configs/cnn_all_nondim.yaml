# Baseline: dilated CNN with the same data setup as fno_all_nondim.
name: cnn_all_nondim
seed: 0

data:
  materials: null             # steel, brass and aluminium (assigned from measured α)
  split:
    type: filter
    test: {period: [5, 6, 55, 60]}   # shortest and longest periods of every material
    val: {period: [30]}
  preprocess:
    points_per_period: 64
    skip_cycles: 0
  dataset:
    window: 256
    stride: 64
    forcing: thermistor_0
    initial_condition: true
    alpha_channel: true       # tells the model which cylinder it is looking at
  time_scale: period         # t and α̂ = α·P/L² per run: materials share one dimensionless range
  batch_size: 16

model:
  name: cnn2d
  kwargs:
    width: 32                 # ~100k params, comparable to fno_all_nondim
    kernel_t: 5
    dilations: [1, 2, 4, 8, 16, 32]   # receptive field 253 samples ~ one window
    causal: false

loss:
  skip_sensors: 1

train:
  epochs: 400
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  patience: null
  min_delta: 0.0
  out_dir: outputs/cnn_all_nondim
  device: null
